apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: neural-ebpf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: neural-ebpf/dashboard:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8501
        envFrom:
        - configMapRef:
            name: neural-ebpf-config
        readinessProbe:
          httpGet:
            path: /api/status
            port: 8501
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: neural-ebpf
spec:
  type: NodePort
  selector:
    app: dashboard
  ports:
  - port: 8501
    targetPort: 8501
    nodePort: 30501
