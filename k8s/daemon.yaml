apiVersion: apps/v1
kind: Deployment
metadata:
  name: daemon
  namespace: neural-ebpf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daemon
  template:
    metadata:
      labels:
        app: daemon
    spec:
      hostPID: true
      containers:
      - name: daemon
        image: neural-ebpf/daemon:latest
        imagePullPolicy: Never
        args: ["--port=8080", "--cpu-threshold=80", "--fd-threshold=200"]
        ports:
        - containerPort: 8080
        securityContext:
          privileged: true
        volumeMounts:
        - name: cgroup
          mountPath: /sys/fs/cgroup
        - name: debugfs
          mountPath: /sys/kernel/debug
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: cgroup
        hostPath:
          path: /sys/fs/cgroup
      - name: debugfs
        hostPath:
          path: /sys/kernel/debug
---
apiVersion: v1
kind: Service
metadata:
  name: daemon
  namespace: neural-ebpf
spec:
  type: NodePort
  selector:
    app: daemon
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
