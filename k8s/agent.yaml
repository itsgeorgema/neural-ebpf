apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: neural-ebpf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
      - name: agent
        image: neural-ebpf/agent:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: neural-ebpf-config
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secret
              key: OPENAI_API_KEY
